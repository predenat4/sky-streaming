<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Fiche - Sky Streaming</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header-flex">
    <h1 style="margin: 0; color: var(--accent-color);">SKY STREAMING</h1>
    <div class="user-menu">
        <button id="userBtn" class="user-icon-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </button>
        <div id="userDropdown" class="user-dropdown glass">
            <p id="userEmail" style="font-size: 0.9rem; margin-bottom: 1rem;"></p>
            <button id="logoutBtn" class="btn-glass-red" style="width: 100%; padding: 10px;">Se déconnecter</button>
        </div>
    </div>
  </header>

  <main class="container animate-entrance">
    <div id="content" class="glass" style="padding: 2rem; margin-top: 2rem;">
        <!-- Le contenu sera injecté par fiche.js -->
    </div>
  </main>

  <script type="module" src="/src/fiche.js"></script>
</body>
</html>
