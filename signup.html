<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - Sky Streaming</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header-flex">
    <h1 style="margin: 0; color: var(--accent-color);">SKY STREAMING</h1>
    <a href="/login.html" class="btn-glass-red">Connexion</a>
  </header>

  <main class="container">
    <div class="glass" style="padding: 2rem; margin-top: 2rem;">
      <h2 style="text-align: center;">Créer un compte</h2>
      <form id="signupForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="email" id="email" placeholder="E-mail" required style="padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
        <input type="password" id="password" placeholder="Mot de passe" required style="padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
        <input type="password" id="passwordConfirm" placeholder="Confirmer le mot de passe" required style="padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
        <button type="submit" class="btn-glass-red">Créer mon compte</button>
      </form>
      <div id="msg" style="margin-top: 1rem; text-align: center;"></div>
    </div>
  </main>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
